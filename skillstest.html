<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <title>Skills Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

body {
            font-family: sans-serif;
            background-color: rgb(220, 193, 253);
}

.container {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            margin-top: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
}

input[type="text"] {
            width: 100%;
            border-radius: 8px;
            padding: 6px 10px;
}

.btn{ border-radius: 10px;
        box-shadow: 0 4px 10px rgba(2, 2, 2, 0);
        text-align: center;
        background-color: #e1b6f9;
        color: #210331;
        width: 100px;
        height: 50px;
        font-size: 20px;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        border-color: #210331;
}

    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="reactor"></div>
            <h1>Non-metal Elements</h1>
            <p>wow Science</p>
        </header>

        <main>
            <form onsubmit="return false;">
                <label for="element_name" class="form-label">Symbol:</label>
                <input type="text" id="element_name" placeholder="Enter a symbol (e.g., He, O, Cl)">
                <br><br>
                <input type="button" py-click="element_checker" value="Enter" class="btn" style="background-color: rgb(225, 197, 251);">
            </form>
            <div id="result" class="mt-3"></div>

         <center>
        <a class="btn" href="index.html"> HOME </a>
        </center>
            
        </main>
    </div>

    <script type="py" src="main.py"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
